name: lmms
version: git
summary: LMMS - Linux MultiMedia Studio
description: |
  LMMS is a cross-platform digital audio workstation for music production,
  sequencing, mixing, and VST-based workflows.

base: core24
confinement: classic
grade: stable

platforms:
  - build-on: [amd64]
    build-for: [amd64]

apps:
  lmms:
    command: usr/bin/lmms
    environment:
      PATH: /usr/bin:$PATH
      WINE: /usr/bin/wine
      WINEPREFIX: $HOME/.wine
      XDG_DATA_DIRS: $HOME/.local/share:/usr/share:$XDG_DATA_DIRS

parts:
  lmms:
    plugin: cmake
    source: .
    source-type: local
    cmake-generator: Ninja
    override-build: |
      set -eux
      git clone --depth=1 https://github.com/fltk/fltk.git "$CRAFT_STAGE/fltk"
      cmake -S "$CRAFT_STAGE/fltk" -B "$CRAFT_STAGE/fltk/build" \
        -DFLTK_BUILD_SHARED_LIBS=ON \
        -DFLTK_BACKEND_WAYLAND=ON \
        -DFLTK_USE_LIBDECOR_GTK=OFF \
        -DFLTK_BUILD_TEST=OFF \
        -DFLTK_BUILD_GL=OFF
      cmake --build "$CRAFT_STAGE/fltk/build"
      cmake --install "$CRAFT_STAGE/fltk/build" --prefix /usr
      craftctl default
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DUSE_WERROR=OFF
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - git
      - qtbase5-dev
      - qtbase5-dev-tools
      - qttools5-dev
      - qttools5-dev-tools
      - libqt5svg5-dev
      - libfftw3-dev
      - libfluidsynth-dev
      - libasound2-dev
      - libjack-jackd2-dev
      - libsndfile1-dev
      - libsdl2-dev
      - libsamplerate0-dev
      - liblilv-dev
      - libsuil-dev
      - lv2-dev
      - libgig-dev
      - libstk-dev
      - portaudio19-dev
      - libpulse-dev
      - libx11-dev
      - libxext-dev
      - libxcb1-dev
      - libxcb-keysyms1-dev
      - libxcb-image0-dev
      - libxcb-randr0-dev
      - libxcb-render-util0-dev
      - libxcb-shape0-dev
      - libxcb-sync0-dev
      - libxcb-xfixes0-dev
      - libxcb-xinerama0-dev
      - libxcb-xkb-dev
      - libxcb-cursor-dev
      - libxcb-icccm4-dev
      - libxcb-util-dev
      - libfontconfig1-dev
      - libfreetype6-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libpng-dev
      - zlib1g-dev
      - libsm-dev
      - libice-dev
    stage-packages:
      - libc6
      - libasound2
      - libfftw3-3
      - libfluidsynth3
      - libgig7
      - libjack-jackd2-0
      - liblilv-0-0
      - libsuil-0-0
      - libsndfile1
      - libsamplerate0
      - libstk0t64
      - libportaudio2
      - libpulse0
      - libqt5svg5
      - libqt5widgets5t64
      - libqt5gui5t64
      - libqt5network5t64
      - libqt5xml5t64
      - libqt5printsupport5t64
      - libqt5dbus5t64
      - libqt5core5t64
      - libqt5concurrent5t64
      - libqt5x11extras5t64
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libfontconfig1
      - libfreetype6
      - libopenal1
      - libvorbis0a
      - libvorbisenc2
      - libogg0
      - libflac12t64
      - libmad0
      - libmp3lame0
      - libpulse-mainloop-glib0
      - libglib2.0-0
      - libglu1-mesa
      - libsm6
      - libice6
